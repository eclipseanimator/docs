definitions:
  - &page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) }}
    {%- endif -%}

  - &page_icon >-
    {{ page.meta.icon | x }}

  - &twitter_page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) }}
    {%- endif %} - {{ config.site_name }}

  - &page_description >-
    {%- if layout.description -%}
      {{ layout.description }}
    {%- else -%}
      {{ page.meta.get("description", config.site_description) | x }}
    {%- endif -%}

size: { width: 1200, height: 630 }
layers:
  - background:
      image: layouts/social_card_bg.png
      color: "#000000aa"

  - size: { width: 630, height: 630 }
    offset: { x: 800, y: 0 }
    icon:
      value: *page_icon
      color: "#7e56c2"
  
  - size: { width: 707, height: 310 }
    offset: { x: 62, y: 62 }
    typography:
      content: *page_title
      align: start
      overflow: shrink
      color: "#ffffff"
      line:
        amount: 3
        height: 1.25

  - size: { width: 707, height: 64 }
    offset: { x: 64, y: 448 }
    typography:
      content: *page_description
      align: start
      overflow: shrink
      color: "#ffffff"
      line:
        amount: 2
        height: 1.5

  - size: { width: 32, height: 32 }
    offset: { x: 64, y: 544 }
    icon:
      value: >-
        {%- if page.meta.tags -%}
          material/tag-text-outline
        {%- endif -%}
      color: "#7e56c2"

  - size: { width: 320, height: 32 }
    offset: { x: 108, y: 544 }
    typography:
      color: "#ffffff"
      content: >-
        {%- if page.meta.tags -%}
          {{ page.meta.tags | join(", ") }}
        {%- endif -%}

tags:
  og:type: website
  og:site_name: Eclipse Animator
  og:title: *page_title
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  twitter:card: summary_large_image
  twitter:title: *twitter_page_title
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"