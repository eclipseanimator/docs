[project]
site_url = "https://eclipseanimator.com/"
site_name = "Eclipse Animator"
site_description = "The flagship animation plugin for Roblox."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/eclipseanimator/docs"
repo_name = "Docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get Started" = "get-started.md" },
  { "Features" = [
      "features/index.md",
      "features/annotations.md",
      "features/blender-tools.md",
      "features/camera-tools.md",
      "features/cinematic-effects.md",
      "features/graph-editor.md",
      "features/grease-pencil.md",
      "features/kinematics.md",
      "features/layers.md",
      "features/live-collab.md",
      "features/module-converter.md",
      "features/motion-paths.md",
      "features/onion-skinning.md",
      "features/physics.md",
      "features/unparenting.md",
      "features/vfx-preview.md",
  ] },
  { "Guides" = [
      "guides/index.md",
      { "Migrating" = [
          "guides/migrating/roblox.md",
          "guides/migrating/moon-animator.md",
          "guides/migrating/blender.md",
      ] },
  ] },
  { "Addons" = [
      "addons/blender.md",
      "addons/video.md"
  ] },
  { "Creator Store" = "https://create.roblox.com/store/asset/86116556258301" },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
favicon = "docs/assets/logo.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

logo = "assets/logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "deep purple"

[[project.extra.social]]
icon = "fontawesome/brands/roblox-creator-studio"
link = "https://create.roblox.com/store/asset/86116556258301/"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/eclipseanimator"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.extra.status]
new = "Recently added"

[project.plugins.tags]

[project.extra.tags]
Feature = "feature"
Guide = "guide"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
    "*"
]

[project.plugins.meta]

[project.plugins.social]
cards_layout = "social_card"
debug = true